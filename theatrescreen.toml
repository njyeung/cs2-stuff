[source]
type = "github_release"
repo = "njyeung/cs2-stuff"
asset = '^TheatreScreen\.zip$'
version = "latest"

[[layout]]
from = "TheatreScreen"
to = "addons/counterstrikesharp/plugins/TheatreScreen"

# TheatreVoice: the Metamod plugin that posts the voice messages TheatreScreen builds.
[[layout]]
from = "theatrevoice"
to = "addons/theatrevoice"

[[layout]]
from = "metamod"
to = "addons/metamod"

[[template]]
path = "addons/counterstrikesharp/configs/plugins/TheatreScreen/TheatreScreen.json"
body = '''
{
  "BottomLeft": [1023.92, -2465.0, -176.0],
  "BottomRight": [860.16, -2465.0, -176.0],
  "FacingYaw": 90.0,
  "Elevation": 24.0,
  "Columns": 96,
  "Rows": 54,
  "FeederUrl": "http://172.30.0.1:8787",
  "FramesPerSecond": 15,
  "Backdrop": true,
  "PixelType": "beam",
  "TextGlyph": "█",
  "TextScale": 1.0,
  "ConfigVersion": 1
}
'''
